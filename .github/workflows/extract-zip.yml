
name: Extract dashboard ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          set -e
          mkdir -p /tmp/vessel
          unzip -o catchaniggi-vessel-dashboard-upgrade.zip -d /tmp/vessel
          cp -R /tmp/vessel/oman-uae-vessel-monitor-work/. .
          rm -f catchaniggi-vessel-dashboard-upgrade.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract vessel dashboard project"
          git push
